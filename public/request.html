<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arazel Request</title><link rel="stylesheet" href="style.css"></head><body><div class="login"><div class="loginbox"><div class="logo">A</div><small>ARAZEL REQUEST</small><h1>ثبت درخواست</h1><select id="t"><option value="off-duty">Off-Duty</option><option value="fire">Fire</option></select><input id="n" placeholder="نام"><input id="h" type="number" placeholder="مدت ساعت"><textarea id="r" placeholder="دلیل"></textarea><button onclick="send()">ثبت</button><p id="m"></p></div></div><script>async function send(){let x=await fetch('/api/tickets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:t.value,playerName:n.value,reason:r.value,durationHours:h.value})});let d=await x.json();m.textContent=x.ok?'ثبت شد':d.error}</script></body></html>
